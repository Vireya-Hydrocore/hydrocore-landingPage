<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login Admin</title>
  <link rel="shortcut icon" href=" /assets/imgs/vireya_icon.png" type="image/x-icon">
  <link rel="stylesheet" href=" /assets/css/loginAdmin.css">
</head>

<style>
  body{
    /* várias imagens ao mesmo tempo */
    background-image:
    url(" /assets/imgs/vireya_icon.png"),   /* flor */
    url(" /assets/imgs/ondaAzul.png"),      /* onda esquerda */
    url(" /assets/imgs/ondaVerde.png");     /* onda direita */
  }
</style>

<body>

<div class="login-container">
  <h2>Login (Área restrita)</h2>
  <form>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Digite seu email" required>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
