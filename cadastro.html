<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href=" /assets/imgs/vireya_icon.png" type="image/x-icon">
    <link rel="stylesheet" href=" /assets/css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Cadastrar-se</title>
</head>

<body>

<main>
    <div class="container-esquerdo">
        <div class="logo">
            <img src=" /assets/imgs/vireya_icon.png">
            <span>HydroCore</span>
        </div>

        <h1>Criar Conta</h1>

        <form id="form">
            <label for="nome">Nome</label>
            <input name="nome" type="text" id="nome" maxlength="80" placeholder="Digite seu nome">
            <div id="erroNome" class="erro"></div>

            <label for="email">E-mail</label>
            <input name="email" type="email" id="email" placeholder="Digite seu e-mail">
            <div id="erroEmail" class="erro"></div>

            <label for="cnpj">CNPJ</label>
            <input name="cnpj" type="text" id="cnpj" placeholder="Digite seu CNPJ"
                   pattern="[0-9]{2}\.[0-9]{3}\.[0-9]{3}/[0-9]{4}-[0-9]{2}">
            <div id="erroCNPJ" class="erro"></div>

            <label for="senha">Senha</label>
            <div class="parametros-senha">
                <ul>
                    <li id="length" class="invalid">8 caracteres</li>
                    <li id="uppercase" class="invalid">1 letra maiúscula</li>
                    <li id="special" class="invalid">1 caractere especial (!@#$%)</li>
                    <li id="number" class="invalid">1 número</li>
                </ul>
            </div>

            <div class="input-senha">
                <input type="password" name="senha" id="senha" maxlength="36" placeholder="Digite sua senha" required
                       pattern="^(?=.*[A-Z])(?=.*[!@#$%]).{8,}$"
                       title="Tem que incluir pelo menos uma letra maiúscula e um caractere especial(!@#$%)">
                <span class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                </span>
            </div>

            <div id="erroSenha" class="erro"></div>


            <label for="telefone">Telefone</label>
            <input name="telefone" type="text" id="telefone" placeholder="Digite o telefone (99) 99999-9999"
                   pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
            <div id="erroTelefone" class="erro"></div>

            <label for="capacidade">Capacidade</label>
            <input name="capacidade" type="number" id="capacidade" placeholder="1000">
            <div id="erroCapacidade" class="erro"></div>

            <div class="checkbox">
                <input type="checkbox" id="termos">
                <label for="termos">Termos e Condições de Uso</label>
            </div>
            <button class="botao" type="submit"><a href="cadastro2.html">Cadastre-se</a></button>
            <p class="login-text">Já possui uma conta? <a href=" /assets/pages/landingpage/login.jsp">Clique aqui</a></p>
        </form>
    </div>

    <div class="container-direito">
        <div class="sobreposicao">
            <img src=" /assets/imgs/fundoGeometrico.png">
        </div>
        <div class="celular">
            <img src=" /assets/imgs/modelo_frontal.png">
        </div>
    </div>

</main>

    <script src=" /assets/js/regex.js"></script>
    <script src=" /assets/js/script.js"></script>
    <script src=" /assets/js/mostrarSenha.js"></script>

</body>
</html>
